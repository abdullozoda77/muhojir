# Muhojir (FastAPI) site (installed as /etc/nginx/snippets/muhojir-api-site.conf).
# The React site from frontend/dist; the API, admin, API docs and live notifications from uvicorn (127.0.0.1:8071).

client_max_body_size 12M;  # document photos and receipts (the site allows up to 10 MB)

# Compress text files, so pages open faster on mobile data.
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml application/manifest+json;

root /home/romin/muhojir-api/frontend/dist;
index index.html;

location /media/ {
    alias /home/romin/muhojir-api/media/;
    expires 7d;
}

location ~ ^/(api|admin|swagger|redoc)(/|$) {
    proxy_pass http://127.0.0.1:8071;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# The AI assistant may look things up several times before it answers, so it gets more time.
# (^~ makes nginx use this block and not the regex /api block above.)
location ^~ /api/assistant/ {
    proxy_pass http://127.0.0.1:8071;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
}

# Live notifications: the WebSocket stays open, so nginx must pass the upgrade and not cut it after 60 s.
location /ws/ {
    proxy_pass http://127.0.0.1:8071;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
}

# The service worker must always be checked for a new version, or phones keep the old site.
location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}

# Built JS/CSS files have a hash in their names, so browsers may keep them for a long time.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# Every other address is a page of the React app (/documents, /jobs/5…).
location / {
    try_files $uri $uri/ /index.html;
}
