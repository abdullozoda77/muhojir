client_max_body_size 12M;

gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml application/manifest+json;

root /home/romin/muhojir-api/frontend/dist;
index index.html;

location /media/ {
    alias /home/romin/muhojir-api/media/;
    expires 7d;
}

location ~ ^/(api|admin|swagger|redoc)(/|$) {
    proxy_pass http://127.0.0.1:8071;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location ^~ /api/assistant/ {
    proxy_pass http://127.0.0.1:8071;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
}

location /ws/ {
    proxy_pass http://127.0.0.1:8071;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
}

location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}

location = /index.html {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}

location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.html;
}
